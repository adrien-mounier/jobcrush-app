<script>const V={"A":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Total Plan Implementation Project Manager\u003c/title>\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background:#ebe6dc;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background:#ebe6dc;\">\n\u003ctr>\u003ctd align=\"center\" style=\"padding:24px 12px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"max-width:600px;\">\n\u003ctr>\u003ctd style=\"background:#f6f2ea;border:1px solid #e2dacb;padding:36px 36px 30px;\">\u003cp style=\"margin:0 0 18px;font:600 12px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6b6455;\">JobCrush &nbsp;·&nbsp; Application report\u003c/p>\n       \u003ch1 style=\"margin:0 0 6px;font:400 27px/1.25 Georgia,'Times New Roman',serif;color:#16150f;\">Total Plan Implementation Project Manager\u003c/h1>\n       \u003cp style=\"margin:0 0 20px;font:15px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;\">MSCI &nbsp;·&nbsp; Hong Kong, Hong Kong\u003c/p>\n       \u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"border-top:2px solid #e8a33d;border-bottom:1px solid #e2dacb;\">\u003ctr>\n         \u003ctd style=\"padding:16px 0;font:400 34px/1 Georgia,'Times New Roman',serif;color:#16150f;width:1%;white-space:nowrap;\">4\u003cspan style=\"color:#6b6455;font-size:22px;\"> of 6\u003c/span>\u003c/td>\n         \u003ctd style=\"padding:16px 0 16px 16px;font:15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">of the job's requirements are covered by your facts.\u003cbr>\u003cspan style=\"color:#6b6455;\">2 to prepare an answer for.\u003c/span>\u003c/td>\n       \u003c/tr>\u003c/table>\n       \u003cp style=\"margin:18px 0 0;font:14px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;\">Your CV for Total Plan Implementation Project Manager at MSCI is attached (2 pages, PDF). Read it, then send it yourself when you are ready.\u003c/p>\n       \u003cp style=\"margin:12px 0 0;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;\">No apply link was saved for this job.\u003c/p>\n       \n       \u003cp style=\"margin:30px 0 10px;font:600 11px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8762b;\">1 &nbsp;·&nbsp; The job, in short\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">MSCI is hiring a Project Manager in Hong Kong for its Total Plan Onboarding team, to run client investment-data onboarding projects on its platform. The role is about keeping projects on track, communicating status to clients and internal teams, defining scope and deliverables with stakeholders, and flagging risks early. It wants solid project-management and finance-industry grounding plus the ability to juggle several projects at once.\u003c/p>\n       \u003cp style=\"margin:30px 0 10px;font:600 11px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8762b;\">2 &nbsp;·&nbsp; Where you are strong\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Knowledge of project management methodologies and best practices, applied within a Financial Institution for a minimum of 5 years\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I&#39;ve delivered IT projects using Agile and Scrum inside banks like BRED and Societe Generale, communicating delivery status and escalating risks and issues to prevent delays.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Knowledge of financial instruments and finance in general, with a minimum of 5 years&#39; engagement within the financial industry\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I coordinated development of the FINDER chatbot with data science teams for the Risk department, giving natural-language access to large regulatory documentation.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Define project scope, goals, and deliverables in collaboration with management and stakeholders, drawing on product knowledge\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I translated business and user needs into functional specifications and user stories, and led a cross-functional team on scope, priorities, budget, and delivery timelines.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Determine content and frequency of status updates and identify risk and mitigation paths\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I delivered IT projects using Agile and Scrum, communicating delivery status and escalating risks and issues to prevent delays.”\u003c/p>\n       \u003cp style=\"margin:30px 0 10px;font:600 11px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8762b;\">3 &nbsp;·&nbsp; Where you are not, and what to say\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Knowledge of Single-Family-Offices, Hedge Funds, OCIO and Endowments business strategies and operational needs\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;color:#6b6455;font-style:italic;margin-bottom:18px;\">You have nothing close to this. Expect it to come up.\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Strong collaboration and organizational skills, fostering the same within client teams\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I designed AI-supported working processes, won general-manager approval, and trained teams through 10 workshops and designated mentors, reaching about 20 users across three teams.”\u003c/p>\n       \u003cp style=\"margin:30px 0 10px;font:600 11px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8762b;\">4 &nbsp;·&nbsp; Be ready to explain\u003c/p>\n       \u003cp style=\"margin:0 0 12px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;\">Lines you chose to add to this CV, and what to say if asked:\u003c/p>\n       \u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Managed onboarding of a new chatbot capability for the Risk department, coordinating data science teams through integration into existing workflows\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I coordinated the FINDER chatbot build end to end with the data science teams, which included planning how it would integrate into the Risk department&#39;s existing workflow and documentation access.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Translated business and user needs into functional specifications and user stories, leading a cross-functional team on scope, priorities, budget, and delivery timelines, and presenting project retrospectives to management\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“As Product Owner I regularly reported progress and outcomes to management as part of leading the cross-functional team, which included looking back at what worked and what to improve for the next cycle.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Delivered IT projects using Agile/Scrum, setting clear expectations with stakeholders and communicating delivery status while escalating risks and issues to prevent delays\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“Running Agile/Scrum delivery meant setting sprint goals and expectations with stakeholders up front, alongside the status updates and risk escalation I already report on my CV.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Plans execution strategy and schedules project meetings with business sponsors and IT management across the AI delivery projects, managing risks, dependencies and timelines\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“Keeping sponsors and IT management aligned on the AI delivery projects meant setting up a regular meeting cadence alongside the risk and dependency tracking I already do.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Written and verbal stakeholder communication\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“Writing specifications, acceptance criteria, and training materials, and presenting to banks from seven countries, all required clear written and verbal communication.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Authored the agent instructions, skills, orchestration and MCP configuration connecting agents to Teams, email, Jira, OTRS and documentation, while running this alongside the incident-analysis, QA-testbook and progress-tracking workstreams\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“The incident-analysis workflow, the QA-testbook automation, and the progress-tracking assistant were all in build or pilot at overlapping times, alongside the agent configuration work.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Coordinated development of the FINDER chatbot with data science teams for the Risk department, quickly building functional knowledge of natural-language and regulatory-documentation tooling to do so\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I wasn&#39;t a data scientist going in, so getting the FINDER chatbot coordinated meant picking up the natural-language processing and regulatory-documentation concepts quickly enough to work with the data science team.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Drove Ship24 to 16M website visitors, 3000+ active API subscriptions, +30% YoY user growth, and +50% YoY advertising-revenue growth in 2023 through sustained focus on growth targets\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“Those growth numbers came from setting clear targets each quarter and focusing the team&#39;s work against them, not from incidental growth.”\u003c/p>\n       \u003cp style=\"margin:8px 0 10px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;\">Also prepare:\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— Be ready to add up your project management years across BRED and Societe Generale into a clear timeline, since the interviewer will want a number, not a list of projects.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— Have a clear answer ready on how your finance-industry engagement breaks down over time, beyond the FINDER chatbot project.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— If asked about onboarding or integration project management specifically, be ready to describe your process design and training work at BRED in those terms.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— If asked for a client-facing project overview or retrospective example, have the Okoone retrospective work and the BRED status communication ready to connect.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— Prepare a concrete example of setting expectations directly with team members, not just communicating status upward.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— You have no exposure to Single-Family-Offices, Hedge Funds, OCIO or Endowments; expect this to come up and have a plan for how you would close that gap quickly.\u003c/p>\n       \u003cp style=\"margin:30px 0 10px;font:600 11px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8762b;\">5 &nbsp;·&nbsp; Salary\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">The advert does not state a salary.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 8px;font:12px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;text-align:center;\">Sent by JobCrush. The CV is attached; nothing has been sent to the employer.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>","A+":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Total Plan Implementation Project Manager\u003c/title>\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background:#ebe6dc;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background:#ebe6dc;\">\n\u003ctr>\u003ctd align=\"center\" style=\"padding:24px 12px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"max-width:600px;\">\n\u003ctr>\u003ctd style=\"backgr e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I&#39;ve delivered IT projects using Agile and Scrum inside banks like BRED and Societe Generale, communicating delivery status and escalating risks and issues to prevent delays.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Knowledge of financial instruments and finance in general, with a minimum of 5 years&#39; engagement within the financial industry\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I coordinated development of the FINDER chatbot with data science teams for the Risk department, giving natural-language access to large regulatory documentation.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Define project scope, goals, and deliverables in collaboration with management and stakeholders, drawing on product knowledge\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I translated business and user needs into functional specifications and user stories, and led a cross-functional team on scope, priorities, budget, and delivery timelines.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Determine content and frequency of status updates and identify risk and mitigation paths\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I delivered IT projects using Agile and Scrum, communicating delivery status and escalating risks and issues to prevent delays.”\u003c/p>\n       \u003cp style=\"margin:30px 0 10px;font:600 11px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8762b;\">3 &nbsp;·&nbsp; Where you are not, and what to say\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Knowledge of Single-Family-Offices, Hedge Funds, OCIO and Endowments business strategies and operational needs\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;color:#6b6455;font-style:italic;margin-bottom:18px;\">You have nothing close to this. Expect it to come up.\u003c/p>\u003cp style=\"margin:0 0 4px;font:600 15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Strong collaboration and organizational skills, fostering the same within client teams\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I designed AI-supported working processes, won general-manager approval, and trained teams through 10 workshops and designated mentors, reaching about 20 users across three teams.”\u003c/p>\n       \u003cp style=\"margin:30px 0 10px;font:600 11px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8762b;\">4 &nbsp;·&nbsp; Be ready to explain\u003c/p>\n       \u003cp style=\"margin:0 0 12px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;\">Lines you chose to add to this CV, and what to say if asked:\u003c/p>\n       \u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Managed onboarding of a new chatbot capability for the Risk department, coordinating data science teams through integration into existing workflows\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I coordinated the FINDER chatbot build end to end with the data science teams, which included planning how it would integrate into the Risk department&#39;s existing workflow and documentation access.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Translated business and user needs into functional specifications and user stories, leading a cross-functional team on scope, priorities, budget, and delivery timelines, and presenting project retrospectives to management\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“As Product Owner I regularly reported progress and outcomes to management as part of leading the cross-functional team, which included looking back at what worked and what to improve for the next cycle.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Delivered IT projects using Agile/Scrum, setting clear expectations with stakeholders and communicating delivery status while escalating risks and issues to prevent delays\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“Running Agile/Scrum delivery meant setting sprint goals and expectations with stakeholders up front, alongside the status updates and risk escalation I already report on my CV.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Plans execution strategy and schedules project meetings with business sponsors and IT management across the AI delivery projects, managing risks, dependencies and timelines\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“Keeping sponsors and IT management aligned on the AI delivery projects meant setting up a regular meeting cadence alongside the risk and dependency tracking I already do.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Written and verbal stakeholder communication\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“Writing specifications, acceptance criteria, and training materials, and presenting to banks from seven countries, all required clear written and verbal communication.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Authored the agent instructions, skills, orchestration and MCP configuration connecting agents to Teams, email, Jira, OTRS and documentation, while running this alongside the incident-analysis, QA-testbook and progress-tracking workstreams\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“The incident-analysis workflow, the QA-testbook automation, and the progress-tracking assistant were all in build or pilot at overlapping times, alongside the agent configuration work.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Coordinated development of the FINDER chatbot with data science teams for the Risk department, quickly building functional knowledge of natural-language and regulatory-documentation tooling to do so\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“I wasn&#39;t a data scientist going in, so getting the FINDER chatbot coordinated meant picking up the natural-language processing and regulatory-documentation concepts quickly enough to work with the data science team.”\u003c/p>\u003cp style=\"margin:0 0 4px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">Drove Ship24 to 16M website visitors, 3000+ active API subscriptions, +30% YoY user growth, and +50% YoY advertising-revenue growth in 2023 through sustained focus on growth targets\u003c/p>\u003cp style=\"margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid #e8a33d;font:italic 15px/1.55 Georgia,'Times New Roman',serif;color:#3d3a30;\">“Those growth numbers came from setting clear targets each quarter and focusing the team&#39;s work against them, not from incidental growth.”\u003c/p>\n       \u003cp style=\"margin:8px 0 10px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;\">Also prepare:\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— Be ready to add up your project management years across BRED and Societe Generale into a clear timeline, since the interviewer will want a number, not a list of projects.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— Have a clear answer ready on how your finance-industry engagement breaks down over time, beyond the FINDER chatbot project.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— If asked about onboarding or integration project management specifically, be ready to describe your process design and training work at BRED in those terms.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— If asked for a client-facing project overview or retrospective example, have the Okoone retrospective work and the BRED status communication ready to connect.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— Prepare a concrete example of setting expectations directly with team members, not just communicating status upward.\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">— You have no exposure to Single-Family-Offices, Hedge Funds, OCIO or Endowments; expect this to come up and have a plan for how you would close that gap quickly.\u003c/p>\n       \u003cp style=\"margin:30px 0 10px;font:600 11px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8762b;\">5 &nbsp;·&nbsp; Salary\u003c/p>\u003cp style=\"margin:0 0 12px;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16150f;\">The advert does not state a salary.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 8px;font:12px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6b6455;text-align:center;\">Sent by JobCrush. The CV is attached; nothing has been sent to the employer.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>","B":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Total Plan Implementation Project Manager\u003c/title>\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background:#faf9f7;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background:#faf9f7;\">\n\u003ctr>\u003ctd align=\"center\" style=\"padding:24px 12px;\">\n\u003ctable role=\"prese olor:#33393f;\">Say: “Running Agile/Scrum delivery meant setting sprint goals and expectations with stakeholders up front, alongside the status updates and risk escalation I already report on my CV.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Plans execution strategy and schedules project meetings with business sponsors and IT management across the AI delivery projects, managing risks, dependencies and timelines\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “Keeping sponsors and IT management aligned on the AI delivery projects meant setting up a regular meeting cadence alongside the risk and dependency tracking I already do.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Written and verbal stakeholder communication\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “Writing specifications, acceptance criteria, and training materials, and presenting to banks from seven countries, all required clear written and verbal communication.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Authored the agent instructions, skills, orchestration and MCP configuration connecting agents to Teams, email, Jira, OTRS and documentation, while running this alongside the incident-analysis, QA-testbook and progress-tracking workstreams\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “The incident-analysis workflow, the QA-testbook automation, and the progress-tracking assistant were all in build or pilot at overlapping times, alongside the agent configuration work.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Coordinated development of the FINDER chatbot with data science teams for the Risk department, quickly building functional knowledge of natural-language and regulatory-documentation tooling to do so\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “I wasn&#39;t a data scientist going in, so getting the FINDER chatbot coordinated meant picking up the natural-language processing and regulatory-documentation concepts quickly enough to work with the data science team.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Drove Ship24 to 16M website visitors, 3000+ active API subscriptions, +30% YoY user growth, and +50% YoY advertising-revenue growth in 2023 through sustained focus on growth targets\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “Those growth numbers came from setting clear targets each quarter and focusing the team&#39;s work against them, not from incidental growth.”\u003c/p>\u003cp style=\"margin:6px 0 10px;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">Also prepare:\u003c/p>\u003cul style=\"margin:0 0 14px;padding-left:20px;\">\u003cli style=\"margin:0 0 8px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Be ready to add up your project management years across BRED and Societe Generale into a clear timeline, since 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Managed onboarding of a new chatbot capability for the Risk department, coordinating data science teams through integration into existing workflows\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “I coordinated the FINDER chatbot build end to end with the data science teams, which included planning how it would integrate into the Risk department&#39;s existing workflow and documentation access.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Translated business and user needs into functional specifications and user stories, leading a cross-functional team on scope, priorities, budget, and delivery timelines, and presenting project retrospectives to management\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “As Product Owner I regularly reported progress and outcomes to management as part of leading the cross-functional team, which included looking back at what worked and what to improve for the next cycle.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Delivered IT projects using Agile/Scrum, setting clear expectations with stakeholders and communicating delivery status while escalating risks and issues to prevent delays\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “Running Agile/Scrum delivery meant setting sprint goals and expectations with stakeholders up front, alongside the status updates and risk escalation I already report on my CV.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Plans execution strategy and schedules project meetings with business sponsors and IT management across the AI delivery projects, managing risks, dependencies and timelines\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “Keeping sponsors and IT management aligned on the AI delivery projects meant setting up a regular meeting cadence alongside the risk and dependency tracking I already do.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Written and verbal stakeholder communication\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “Writing specifications, acceptance criteria, and training materials, and presenting to banks from seven countries, all required clear written and verbal communication.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Authored the agent instructions, skills, orchestration and MCP configuration connecting agents to Teams, email, Jira, OTRS and documentation, while running this alongside the incident-analysis, QA-testbook and progress-tracking workstreams\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “The incident-analysis workflow, the QA-testbook automation, and the progress-tracking assistant were all in build or pilot at overlapping times, alongside the agent configuration work.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Coordinated development of the FINDER chatbot with data science teams for the Risk department, quickly building functional knowledge of natural-language and regulatory-documentation tooling to do so\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “I wasn&#39;t a data scientist going in, so getting the FINDER chatbot coordinated meant picking up the natural-language processing and regulatory-documentation concepts quickly enough to work with the data science team.”\u003c/p>\u003cp style=\"margin:0 0 6px;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Drove Ship24 to 16M website visitors, 3000+ active API subscriptions, +30% YoY user growth, and +50% YoY advertising-revenue growth in 2023 through sustained focus on growth targets\u003c/p>\u003cp style=\"margin:0 0 16px;padding:10px 12px;background:#faf9f7;border-radius:4px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#33393f;\">Say: “Those growth numbers came from setting clear targets each quarter and focusing the team&#39;s work against them, not from incidental growth.”\u003c/p>\u003cp style=\"margin:6px 0 10px;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">Also prepare:\u003c/p>\u003cul style=\"margin:0 0 14px;padding-left:20px;\">\u003cli style=\"margin:0 0 8px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Be ready to add up your project management years across BRED and Societe Generale into a clear timeline, since the interviewer will want a number, not a list of projects.\u003c/li>\u003cli style=\"margin:0 0 8px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Have a clear answer ready on how your finance-industry engagement breaks down over time, beyond the FINDER chatbot project.\u003c/li>\u003cli style=\"margin:0 0 8px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">If asked about onboarding or integration project management specifically, be ready to describe your process design and training work at BRED in those terms.\u003c/li>\u003cli style=\"margin:0 0 8px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">If asked for a client-facing project overview or retrospective example, have the Okoone retrospective work and the BRED status communication ready to connect.\u003c/li>\u003cli style=\"margin:0 0 8px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Prepare a concrete example of setting expectations directly with team members, not just communicating status upward.\u003c/li>\u003cli style=\"margin:0 0 8px;font:14px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">You have no exposure to Single-Family-Offices, Hedge Funds, OCIO or Endowments; expect this to come up and have a plan for how you would close that gap quickly.\u003c/li>\u003c/ul>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"height:14px;line-height:14px;font-size:0;\">&nbsp;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"background:#ffffff;border:1px solid #d9d5cf;border-top:3px solid #e8a33d;border-radius:6px;padding:22px 24px 10px;\">\u003cp style=\"margin:0 0 14px;font:700 16px/1.3 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Salary\u003c/p>\u003cp style=\"margin:0 0 14px;font:15px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">The advert does not state a salary.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"height:14px;line-height:14px;font-size:0;\">&nbsp;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px 4px;font:12px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;text-align:center;\">Sent by JobCrush. Nothing has been sent to the employer.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>","B2":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Total Plan Implementation Project Manager\u003c/title>\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background:#faf9f7;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background:#faf9f7;\">\n\u003ctr>\u003ctd align=\"center\" style=\"padding:24px 12px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"max-width:600px;\">\n\u003ctr>\u003ctd style=\"background:#171c23;border-radius:8px;padding:28px 28px 26px;\">\u003cp style=\"margin:0 0 22px;font:700 13px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:#e8a33d;\">JobCrush\u003c/p>\n       \u003cp style=\"margin:0 0 6px;font:13px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#8a95a2;\">Your CV is ready for\u003c/p>\n       \u003ch1 style=\"margin:0 0 4px;font:660 25px/1.25 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;\">Total Plan Implementation Project Manager\u003c/h1>\n       \u003cp style=\"margin:0 0 22px;font:15px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#8a95a2;\">MSCI · Hong Kong, Hong Kong\u003c/p>\n       \u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n         \u003ctd style=\"padding:0 8px 0 0;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd style=\"background:#e8a33d;color:#1a n\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"max-width:600px;\">\n\u003ctr>\u003ctd style=\"background:#ffffff;border:1px solid #d9d5cf;border-radius:8px;padding:28px 28px 22px;\">\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n        \u003ctr>\u003ctd colspan=\"2\" style=\"font:700 12px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#a8762b;letter-spacing:.06em;padding-bottom:16px;\">JOBCRUSH · YOUR CV IS ATTACHED\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd colspan=\"2\">\u003ch1 style=\"margin:0;font:660 22px/1.3 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Total Plan Implementation Project Manager\u003c/h1>\n          \u003cp style=\"margin:4px 0 18px;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">MSCI · Hong Kong, Hong Kong · 2-page PDF attached\u003c/p>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd colspan=\"2\" style=\"padding-bottom:6px;font:14px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">\u003cb style=\"font-size:20px;\">4/6\u003c/b>&nbsp; requirements covered by your facts\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd colspan=\"2\" style=\"padding-bottom:4px;\">\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background:#ece8e1;border-radius:4px;\">\u003ctr>\u003ctd width=\"67%\" style=\"background:#e8a33d;height:8px;line-height:8px;font-size:0;border-radius:4px;\">&nbsp;\u003c/td>\u003ctd style=\"font-size:0;\">&nbsp;\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd colspan=\"2\" style=\"padding-top:14px;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">No apply link was saved for this job. Read the CV, then send it yourself when you are ready.\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003ctd colspan=\"2\" style=\"padding:26px 0 8px;border-bottom:1px solid #d9d5cf;font:700 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#59636e;\">The job, in short\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd colspan=\"2\" style=\"padding:12px 0 0;font:14px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">MSCI is hiring a Project Manager in Hong Kong for its Total Plan Onboarding team, to run client investment-data onboarding projects on its platform. The role is about keeping projects on track, communicating status to clients and internal teams, defining scope and deliverables with stakeholders, and flagging risks early. It wants solid project-management and finance-industry grounding plus the ability to juggle several projects at once.\u003cbr>\u003cspan style=\"color:#59636e;\">Salary: The advert does not state a salary.\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd colspan=\"2\" style=\"padding:26px 0 8px;border-bottom:1px solid #d9d5cf;font:700 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#59636e;\">Covered \u003cspan style=\"color:#1f2328;\">· 4\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd valign=\"top\" style=\"width:30px;padding:12px 0 12px;\">\u003cspan style=\"display:inline-block;width:20px;height:20px;line-height:20px;border-radius:10px;background:#e8a33d;color:#1a1206;text-align:center;font:700 12px/20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\">✓\u003c/span>\u003c/td>\u003ctd style=\"padding:12px 0;border-bottom:1px solid #eeebe6;\">\u003cp style=\"margin:0;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Knowledge of project management methodologies and best practices, applied within a Financial Institution for a minimum of 5 years\u003c/p>\u003cp style=\"margin:4px 0 0;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">Say: “I&#39;ve delivered IT projects using Agile and Scrum inside banks like BRED and Societe Generale, communicating delivery status and escalating risks and issues to prevent delays.”\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd valign=\"top\" style=\"width:30px;padding:12px 0 12px;\">\u003cspan style=\"display:inline-block;width:20px;height:20px;line-height:20px;border-radius:10px;background:#e8a33d;color:#1a1206;text-align:center;font:700 12px/20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\">✓\u003c/span>\u003c/td>\u003ctd style=\"padding:12px 0;border-bottom:1px solid #eeebe6;\">\u003cp style=\"margin:0;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Knowledge of financial instruments and finance in general, with a minimum of 5 years&#39; engagement within the financial industry\u003c/p>\u003cp style=\"margin:4px 0 0;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">Say: “I coordinated development of the FINDER chatbot with data science teams for the Risk department, giving natural-language access to large regulatory documentation.”\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd valign=\"top\" style=\"width:30px;padding:12px 0 12px;\">\u003cspan style=\"display:inline-block;width:20px;height:20px;line-height:20px;border-radius:10px;background:#e8a33d;color:#1a1206;text-align:center;font:700 12px/20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\">✓\u003c/span>\u003c/td>\u003ctd style=\"padding:12px 0;border-bottom:1px solid #eeebe6;\">\u003cp style=\"margin:0;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Define project scope, goals, and deliverables in collaboration with management and stakeholders, drawing on product knowledge\u003c/p>\u003cp style=\"margin:4px 0 0;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">Say: “I translated business and user needs into functional specifications and user stories, and led a cross-functional team on scope, priorities, budget, and delivery timelines.”\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd valign=\"top\" style=\"width:30px;padding:12px 0 12px;\">\u003cspan style=\"display:inline-block;width:20px;height:20px;line-height:20px;border-radius:10px;background:#e8a33d;color:#1a1206;text-align:center;font:700 12px/20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\">✓\u003c/span>\u003c/td>\u003ctd style=\"padding:12px 0;border-bottom:1px solid #eeebe6;\">\u003cp style=\"margin:0;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Determine content and frequency of status updates and identify risk and mitigation paths\u003c/p>\u003cp style=\"margin:4px 0 0;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">Say: “I delivered IT projects using Agile and Scrum, communicating delivery status and escalating risks and issues to prevent delays.”\u003c/p>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd colspan=\"2\" style=\"padding:26px 0 8px;border-bottom:1px solid #d9d5cf;font:700 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#59636e;\">Not covered — what to say \u003cspan style=\"color:#1f2328;\">· 2\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd valign=\"top\" style=\"width:30px;padding:12px 0 12px;\">\u003cspan style=\"display:inline-block;width:18px;height:18px;line-height:18px;border-radius:10px;border:1px solid #59636e;color:#59636e;text-align:center;font:700 12px/18px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\">–\u003c/span>\u003c/td>\u003ctd style=\"padding:12px 0;border-bottom:1px solid #eeebe6;\">\u003cp style=\"margin:0;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Knowledge of Single-Family-Offices, Hedge Funds, OCIO and Endowments business strategies and operational needs\u003c/p>\u003cp style=\"margin:4px 0 0;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">\u003ci>You have nothing close to this. Expect it to come up.\u003c/i>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd valign=\"top\" style=\"width:30px;padding:12px 0 12px;\">\u003cspan style=\"display:inline-block;width:18px;height:18px;line-height:18px;border-radius:10px;border:1px solid #a8762b;color:#a8762b;text-align:center;font:700 12px/18px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\">!\u003c/span>\u003c/td>\u003ctd style=\"padding:12px 0;border-bottom:1px solid #eeebe6;\">\u003cp style=\"margin:0;font:600 14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;\">Strong collaboration and organizational skills, fostering the same within client teams\u003c/p>\u003cp style=\"margin:4px 0 0;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#59636e;\">Say: “I designed AI-supported working processes, won general-manager approval, and trained teams through 10 workshops and designated mentors, reaching about 20 users across three teams.”\u003c/p>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd colspan=\"2\" style=\"padding:26px 0 8px;border-bottom:1px solid #d9d5cf;font:700 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#59636e;\">Lines you added — if asked \u003cspan style=\"color:#1f2328;\">· 8\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd valign=\"top\" style=\"width:30px;padding:12px 0 12px;\">\u003cspan style=\"display:inline-block;width:18px;height:18px;line-height:18px;border-radius:10px;border:1px solid #a8762b;color:#a8762b;text-align:center;font:700 12px/18px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\">!\u003c/span>\u003c/td>\u003ctd style=\"padding:12px 0;border-bottom:1px solid #eeebe6  within the financial industry\u003c/p>\u003cp style=\"margin:6px 0 0;font:400 13.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#c3c9d1;\">\u003cspan style=\"color:#8a95a2;\">Say:\u003c/span> “I coordinated development of the FINDER chatbot with data science teams for the Risk department, giving natural-language access to large regulatory documentation.”\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-bottom:1px solid #2b333d;\">\u003ctr>\u003ctd valign=\"top\" width=\"22\" style=\"width:22px;padding:17px 0 0;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd bgcolor=\"#e8a33d\" width=\"10\" height=\"10\" style=\"width:10px;height:10px;line-height:10px;font-size:0;background:#e8a33d;border-radius:2px;\">&nbsp;\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003ctd style=\"padding:13px 0 14px;\">\u003cp style=\"margin:0;font:600 14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;line-height:1.45;\">Define project scope, goals, and deliverables in collaboration with management and stakeholders, drawing on product knowledge\u003c/p>\u003cp style=\"margin:6px 0 0;font:400 13.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#c3c9d1;\">\u003cspan style=\"color:#8a95a2;\">Say:\u003c/span> “I translated business and user needs into functional specifications and user stories, and led a cross-functional team on scope, priorities, budget, and delivery timelines.”\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-bottom:1px solid #2b333d;\">\u003ctr>\u003ctd valign=\"top\" width=\"22\" style=\"width:22px;padding:17px 0 0;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd bgcolor=\"#e8a33d\" d onboarding of a new chatbot capability for the Risk department, coordinating data science teams through integration into existing workflows\u003c/td>\u003c/tr>\u003ctr>\u003ctd bgcolor=\"#1f262f\" style=\"background:#1f262f;border:1px solid #2b333d;border-top:0;border-radius:0 0 6px 6px;padding:10px 14px;font:400 13.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#c3c9d1;\">\u003cspan style=\"color:#8a95a2;\">If asked:\u003c/span> “I coordinated the FINDER chatbot build end to end with the data science teams, which included planning how it would integrate into the Risk department&#39;s existing workflow and documentation access.”\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 12px;\">\u003ctr>\u003ctd bgcolor=\"#f6f2ea\" style=\"background:#f6f2ea;border:1px solid #e2dacb;border-radius:6px 6px 0 0;padding:12px 14px;font:15px/1.5 Georgia,'Times New Roman',serif;color:#16150f;\">Translated business and user needs into functional specifications and user stories, leading a cross-functional team on scope, priorities, budget, and delivery timelines, and presenting project retrospectives to management\u003c/td>\u003c/tr>\u003ctr>\u003ctd bgcolor=\"#1f262f\" style=\"background:#1f262f;border:1px solid #2b333d;border-top:0;border-radius:0 0 6px 6px;padding:10px 14px;font:400 13.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#c3c9d1;\">\u003cspan style=\"color:#8a95a2;\">If asked:\u003c/span> “As Product Owner I regularly reported progress and outcomes to management as part of leading the cross-functional team, which included looking back at what worked and what to improve for the next cycle.”\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 12px;\">\u003ctr>\u003ctd bgcolor=\"#f6f2ea\" style=\"background:#f6f2ea;border:1px solid #e2dacb;border-radius:6px 6px 0 0;padding:12px 14px;font:15px/1.5 Georgia,'Times New Roman',serif;color:#16150f;\">Delivered IT projects using Agile/Scrum, setting clear expectations with stakeholders and communicating delivery status while escalating risks and issues to prevent delays\u003c/td>\u003c/tr>\u003ctr>\u003ctd bgcolor=\"#1f262f\" style=\"background:#1f262f;border:1px solid #2b333d;border-top:0;border-radius:0 0 6px 6px;padding:10px 14px;font:400 13.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#c3c9d1;\">\u003cspan style=\"color:#8a95a2;\">If asked:\u003c/span> “Running Agile/Scrum delivery meant setting sprint goals and expectations with stakeholders up front, alongside the status updates and risk escalation I already report on my CV.”\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 12px;\">\u003ctr>\u003ctd bgcolor=\"#f6f2ea\" style=\"background:#f6f2ea;border:1px solid #e2dacb;border-radius:6px 6px 0 0;padding:12px 14px;font:15px/1.5 Georgia,'Times New Roman',serif;color:#16150f;\">Plans execution strategy and schedules project meetings with business sponsors and IT management across the AI delivery projects, managing risks, dependencies and timelines\u003c/td>\u003c/tr>\u003ctr>\u003ctd bgcolor=\"#1f262f\" style=\"background:#1f262f;border:1px solid #2b333d;border-top:0;border-radius:0 0 6px 6px;padding:10px 14px;font:400 13.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#c3c9d1;\">\u003cspan style=\"color:#8a95a2;\">If asked:\u003c/span> “Keeping sponsors and IT management aligned on the AI delivery projects meant setting up a regular meeting cadence alongside the risk and dependency tracking I already do.”\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 12px;\">\u003ctr>\u003ctd bgcolor=\"#f6f e=\"background:#f6f2ea;border:1px solid #e2dacb;border-radius:6px 6px 0 0;padding:12px 14px;font:15px/1.5 Georgia,'Times New Roman',serif;color:#16150f;\">Coordinated development of the FINDER chatbot with data science teams for the Risk department, quickly building functional knowledge of natural-language and regulatory-documentation tooling to do so\u003c/td>\u003c/tr>\u003ctr>\u003ctd bgcolor=\"#1f262f\" style=\"background:#1f262f;border:1px solid #2b333d;border-top:0;border-radius:0 0 6px 6px;padding:10px 14px;font:400 13.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#c3c9d1;\">\u003cspan style=\"color:#8a95a2;\">If asked:\u003c/span> “I wasn&#39;t a data scientist going in, so getting the FINDER chatbot coordinated meant picking up the natural-language processing and regulatory-documentation concepts quickly enough to work with the data science team.”\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 12px;\">\u003ctr>\u003ctd bgcolor=\"#f6f2ea\" style=\"background:#f6f2ea;border:1px solid #e2dacb;border-radius:6px 6px 0 0;padding:12px 14px;font:15px/1.5 Georgia,'Times New Roman',serif;color:#16150f;\">Drove Ship24 to 16M website visitors, 3000+ active API subscriptions, +30% YoY user growth, and +50% YoY advertising-revenue growth in 2023 through sustained focus on growth targets\u003c/td>\u003c/tr>\u003ctr>\u003ctd bgcolor=\"#1f262f\" style=\"background:#1f262f;border:1px solid #2b333d;border-top:0;border-radius:0 0 6px 6px;padding:10px 14px;font:400 13.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#c3c9d1;\">\u003cspan style=\"color:#8a95a2;\">If asked:\u003c/span> “Those growth numbers came from setting clear targets each quarter and focusing the team&#39;s work against them, not from incidental growth.”\u003c/td>\u003c/tr>\u003c/table>\u003cdiv style=\"height:18px;line-height:18px;font-size:0;\">&nbsp;\u003c/div>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-bottom:1px solid #2b333d;\">\u003ctr>\u003ctd style=\"padding:0 0 10px;font:620 15px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;\">Also prepare\u003c/td>\u003ctd align=\"right\" style=\"padding:0 0 10px;font:400 12.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#8a95a2;\">6\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:0;padding:12px 0;border-bottom:1px solid #2b333d;font:400 14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;\">Be ready to add up your project management years across BRED and Societe Generale into a clear timeline, since the interviewer will want a number, not a list of projects.\u003c/p>\u003cp style=\"margin:0;padding:12px 0;border-bottom:1px solid #2b333d;font:400 14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;\">Have a clear answer ready on how your finance-industry engagement breaks down over time, beyond the FINDER chatbot project.\u003c/p>\u003cp style=\"margin:0;padding:12px 0;border-bottom:1px solid #2b333d;font:400 14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;\">If asked about onboarding or integration project management specifically, be ready to describe your process design and training work at BRED in those terms.\u003c/p>\u003cp style=\"margin:0;padding:12px 0;border-bottom:1px solid #2b333d;font:400 14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;\">If asked for a client-facing project overview or retrospective example, have the Okoone retrospective work and the BRED status communication ready to connect.\u003c/p>\u003cp style=\"margin:0;padding:12px 0;border-bottom:1px solid #2b333d;font:400 14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;\">Prepare a concrete example of setting expectations directly with team members, not just communicating status upward.\u003c/p>\u003cp style=\"margin:0;padding:12px 0;border-bottom:1px solid #2b333d;font:400 14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;\">You have no exposure to Single-Family-Offices, Hedge Funds, OCIO or Endowments; expect this to come up and have a plan for how you would close that gap quickly.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:18px 8px 4px;font:400 12.5px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#8a95a2;text-align:center;\">Read the CV, then send it yourself when you are ready. Nothing has been sent to the employer.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>","D+":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Total Plan Implementation Project Manager\u003c/title>\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background:#101419;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background:#101419;\">\n\u003ctr>\u003ctd align=\"center\" style=\"padding:24px 12px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"max-width:600px;\">\n\u003ctr>\u003ctd style=\"background:#171c23;border:1px solid #2b333d;border-radius:16px;padding:26px 26px 22px;\">\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n        \u003ctr>\u003ctd style=\"padding:0 0 18px;font:700 13px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;letter-spacing:.02em;\">JobCrush \u003cspan style=\"font-weight:400;color:#8a95a2;\">· your CV is attached, 2-page PDF\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ch1 style=\"margin:0;font:660 24px/1.
