<!doctype html>
<!-- PROTOTYPE — throwaway. Question: after #412, where does the person read the job in full on the Tailor screen? Plan: the approved #408 layout with the real white CV, and four placements of the job (?variant=A tab, B side sheet, C rail fold, D side by side with the requirement marked). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tailor: the job in full — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --floor: #101419; --surface: #171c23; --raised: #1f262f; --line: #2b333d;
    --ink: #e8eaed; --muted: #7f8b98; --muted-r: #8a95a2; --weak: #6f7d8c; --settled: #4d5865;
    --gold: #e8a33d; --gold-deep: #a8762b; --gold-light: #ffd9a0; --gold-ink: #1a1206;
    --wash: rgba(232, 163, 61, .22);
    --sans: "Segoe UI Variable Text", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: "SF Mono", "Cascadia Mono", ui-monospace, Consolas, monospace;
    /* the real CV document (apps/api/src/preview.ts renderPreviewHtml) */
    --cv-font: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
    --cv-ink: #1d2126; --cv-blue: #1F4E79; --cv-grey: #5A6675;
    --out: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--floor); color: var(--ink); font: 14px/1.5 var(--sans); }
  ::selection { background: rgba(232, 163, 61, .35); color: var(--ink); }
  .paper ::selection { background: rgba(232, 163, 61, .4); color: var(--cv-ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [tabindex="-1"]:focus { outline: none; }

  /* ---------- prototype chrome (not the design) ---------- */
  .banner { flex: none; background: #241d13; color: #e9cf9f; padding: 7px 16px; font-size: 12.5px; border-bottom: 1px solid #3d3020; padding-right: 260px; }
  .chrome { position: fixed; top: 6px; right: 10px; z-index: 200; display: flex; gap: 2px; background: #fff; color: #111; border-radius: 999px; padding: 3px; box-shadow: 0 6px 20px rgba(0,0,0,.5); font-size: 12.5px; }
  .chrome button { border: 0; background: none; border-radius: 999px; padding: 5px 12px; font-weight: 650; color: #111; }
  .chrome button[aria-pressed="true"] { background: #111; color: #fff; }
  @media (max-width: 600px) { .banner, .chrome { display: none; } }
  .pillbar { flex: none; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-top: 1px dashed #ff4fd8; background: repeating-linear-gradient(45deg, #0a0c10 0 10px, #121520 10px 20px); }
  .pill { display: flex; align-items: center; gap: 4px; background: #fff; color: #111; border-radius: 999px; padding: 3px; font: 650 12.5px var(--sans); box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .pill button { border: 0; background: #111; color: #fff; border-radius: 999px; width: 28px; height: 26px; }
  .pill span { padding: 0 8px; white-space: nowrap; }
  .pstate { font: 11px var(--mono); color: #ff9be9; }

  /* ---------- the app frame ---------- */
  #app { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .scroll { height: 100%; overflow: auto; scrollbar-color: var(--line) transparent; }
  body.framed { background: #0b0e12; align-items: center; }
  body.framed #app { flex: none; width: 390px; height: min(844px, calc(100dvh - 120px)); margin: 14px 0; border: 1px solid var(--line); border-radius: 30px; background: var(--floor); box-shadow: 0 30px 80px -20px rgba(0,0,0,.8); }

  /* ---------- shared: the score ---------- */
  .score { display: inline-flex; align-items: baseline; white-space: nowrap; }
  .score .n { font-variant-numeric: tabular-nums; font-weight: 650; letter-spacing: -0.02em; color: var(--ink); display: inline-block; transition: color 340ms ease, text-shadow 340ms ease; }
  .score .pc { color: var(--muted); font-weight: 600; }
  .score .lb { margin-left: 7px; color: var(--muted); font-size: 12.5px; }
  .score.lit .n { color: var(--gold); text-shadow: 0 0 26px rgba(232, 163, 61, .35); }
  .mote { position: fixed; z-index: 150; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 14px rgba(232, 163, 61, .7); pointer-events: none; }

  /* ---------- shared: buttons ---------- */
  .b { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 10px; padding: 11px 14px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); font-size: 14px; font-weight: 600; min-height: 44px; text-align: center; }
  .b:hover { border-color: var(--muted); }
  .b.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .b.gold:hover { background: var(--gold-light); border-color: var(--gold-light); }
  .b.gold.glow { box-shadow: 0 0 26px rgba(232, 163, 61, .35); }
  .b.quiet { background: none; border-color: transparent; color: var(--muted-r); font-weight: 500; }
  .b.quiet:hover { color: var(--ink); border-color: transparent; }
  .b kbd { font: 10.5px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .55; }
  .link { background: none; border: 0; padding: 4px 2px; color: var(--muted-r); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
  .link:hover { color: var(--ink); }
  .seg { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin: 0 0 12px; }
  .seg button { border: 0; background: none; color: var(--muted-r); padding: 6px 14px; border-radius: 7px; font-weight: 600; font-size: 13px; }
  .seg button[aria-selected="true"] { background: var(--raised); color: var(--ink); }
  .sheet header .seg { margin: 0; }

  /* ---------- shared: suggestion pieces ---------- */
  .why { color: var(--muted-r); font-size: 13px; margin: 6px 0 0; }
  .swap { color: var(--muted-r); font-size: 12.5px; margin: 8px 0 0; }
  .ask { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: #c9d1da; }
  .ask b { display: block; font-size: 12px; font-weight: 600; color: var(--muted-r); margin-bottom: 2px; }
  .ask .re { display: block; color: var(--muted-r); font-size: 12px; margin-top: 4px; }
  .num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 600 11px var(--sans); border: 1px solid var(--gold-deep); color: var(--gold); flex: none; }
  .num.idle { border-color: var(--settled); color: var(--muted); }
  .result { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; }
  .result .r-use { color: var(--gold); } .result .r-true { color: var(--ink); } .result .r-no { color: var(--muted-r); }
  .marks { list-style: none; margin: 0; padding: 0; }
  .marks li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .marks li:last-child { border-bottom: 0; }
  .marks .m { width: 16px; flex: none; text-align: center; color: var(--muted); }
  .marks .m.stretch { color: var(--gold-deep); } .marks .m.met { color: var(--ink); } .marks .m.gap { color: var(--weak); }
  .marks .t { flex: 1; } .marks .s { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .marks .note { display: block; font-size: 12px; color: var(--muted); }
  .gaplist { margin: 6px 0 0; padding-left: 18px; color: var(--ink); font-size: 13px; }
  .h { font-size: 15px; font-weight: 620; margin: 22px 0 6px; letter-spacing: -0.005em; }
  .h:first-child { margin-top: 0; }
  .small { font-size: 12.5px; color: var(--muted); }
  .explain { margin: 6px 0 0; padding: 0; list-style: none; }
  .explain li { margin: 0 0 10px; font-size: 13px; color: #c9d1da; }
  .explain q { display: block; color: var(--ink); quotes: "“" "”"; }

  /* ---------- the paper: the real CV document, white, as the API renders it ---------- */
  .fit { container-type: inline-size; }
  .paper { max-width: 720px; background: #fff; color: var(--cv-ink); font: 14px/1.4 var(--cv-font); border-radius: 10px; padding: 34px 44px 36px; box-shadow: 0 18px 40px -16px rgba(0,0,0,.55); }
  @container (max-width: 480px) { .paper { padding: 20px 16px; } }
  .paper .banner-d { background: #fbeaea; border: 1px solid #d99; color: #8a1f1f; font-size: 12px; padding: 8px 14px; border-radius: 6px; margin-bottom: 24px; }
  .paper h1 { font-size: 23px; margin: 0; color: var(--cv-blue); letter-spacing: .01em; }
  .paper .headline { margin: 5px 0 0; font-size: 12.5px; color: #444; }
  .paper .role-word { font-weight: bold; text-transform: uppercase; letter-spacing: .06em; color: var(--cv-ink); }
  .paper h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--cv-blue); border-bottom: 1.5px solid var(--cv-blue); padding-bottom: 3px; margin: 18px 0 7px; }
  .paper .role { margin-bottom: 12px; }
  .paper .role-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .paper .dates { color: var(--cv-grey); font-size: 12px; white-space: nowrap; }
  .paper .role-title { font-style: italic; margin: 1px 0 2px; }
  .paper ul { margin: 4px 0 0; padding-left: 18px; }
  .paper li { margin-bottom: 2px; }
  .paper .summary { margin: 0 0 4px; }
  .paper .skill-group { margin: 0 0 8px; }
  .paper .edu, .paper .addl { margin: 0 0 6px; }
  .paper li, .paper .skill-group, .paper .summary { position: relative; }
  .paper del { color: var(--cv-grey); text-decoration-color: rgba(90,102,117,.7); }
  .paper ins, .clip ins { text-decoration: none; background: var(--wash); border-radius: 3px; box-shadow: 0 0 0 3px var(--wash); }
  .paper ins[contenteditable="true"], .clip ins[contenteditable="true"] { outline: 2px dashed var(--gold-deep); outline-offset: 3px; }
  .paper .landed { animation: land 1100ms var(--out); border-radius: 3px; }
  @keyframes land { from { background: var(--wash); box-shadow: 0 0 0 3px var(--wash); } to { background: transparent; box-shadow: 0 0 0 3px transparent; } }
  .paper .pin { position: absolute; left: -30px; top: 1px; display: inline-grid; place-items: center; width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid var(--cv-grey); background: #fff; color: var(--cv-grey); font: 600 11px/1 var(--cv-font); }
  .paper .pin.open { border-color: #a8762b; background: #e8a33d; color: #1a1206; }
  .paper .pin.used { border: 0; background: none; color: #a8762b; font-size: 13px; }

  /* ---------- the job ad (dark room: it is not the printed page) ---------- */
  .ad { color: #c9d1da; font-size: 14px; line-height: 1.55; }
  .ad .adhead b { display: block; color: var(--ink); font-size: 15px; font-weight: 620; }
  .ad .adhead span { color: var(--muted); font-size: 12.5px; }
  .ad h4 { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-r); font-weight: 650; margin: 18px 0 6px; }
  .ad p { margin: 0 0 8px; }
  .ad ul { list-style: none; margin: 0; padding-left: 26px; }
  .ad li { position: relative; margin: 0 0 6px; }
  .ad li::before { content: "•"; position: absolute; left: -14px; color: var(--muted); }
  .ad li.has-pin::before { content: none; }
  .ad li.hl { color: var(--ink); background: rgba(232, 234, 237, .08); box-shadow: 0 0 0 5px rgba(232, 234, 237, .08); border-radius: 3px; }
  .apin { position: absolute; left: -27px; top: 1px; border: 0; padding: 0; background: none; }
  .apin.used { color: var(--gold-deep); font-size: 13px; left: -24px; top: 0; }
  .adpanel { max-width: 720px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px 36px 32px; }

  /* ---------- computer ---------- */
  .dbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 12px 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .dbar .title { flex: 1; min-width: 0; }
  .dbar .title b { display: block; font-size: 15px; font-weight: 620; }
  .dbar .title span { color: var(--muted); font-size: 12.5px; }
  .dbar .score .n { font-size: 27px; }
  .prog { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .dots { display: flex; gap: 5px; }
  .dots button, .dots i { width: 18px; height: 4px; border-radius: 2px; border: 0; padding: 0; background: var(--line); }
  .dots .on { background: var(--gold); } .dots .did { background: var(--muted); }
  .dgrid { display: grid; grid-template-columns: minmax(0, 720px) 380px; gap: 32px; justify-content: center; padding: 24px 28px 60px; }
  .dgrid.d-closed { grid-template-columns: 40px minmax(0, 720px) 360px; gap: 24px; }
  .dgrid.d-open { grid-template-columns: 290px minmax(0, 720px) 340px; gap: 24px; }
  .rail { position: relative; }
  .dnote { position: absolute; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; transition: top 340ms var(--out); }
  .dnote h3 { display: flex; gap: 10px; align-items: flex-start; margin: 0; font-size: 15px; font-weight: 620; line-height: 1.35; outline: none; }
  .dnote .acts { display: grid; gap: 8px; margin-top: 14px; }
  .dnote .acts .row { display: flex; gap: 6px; }
  .dnote .acts .b { justify-content: space-between; text-align: left; }
  .dnote .nav { display: flex; justify-content: space-between; margin-top: 10px; }
  .dsum { position: sticky; top: 86px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .dsum .b.gold { width: 100%; margin-top: 18px; }
  /* C: the quiet fold under the suggestion */
  .rfold { margin: 14px -18px -18px; border-top: 1px solid var(--line); }
  .dsum .rfold { margin: 18px -20px -20px; }
  .rfold summary, .pfold summary { padding: 12px 18px; color: var(--muted-r); font-size: 13px; cursor: pointer; }
  .rfold summary:hover, .pfold summary:hover { color: var(--ink); }
  .rfold .ad { max-height: 340px; overflow: auto; padding: 0 18px 18px; font-size: 13px; }
  /* D: the job as its own column, left of the CV */
  .adcol { position: sticky; top: 88px; align-self: start; max-height: calc(100dvh - 215px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 18px; scrollbar-color: var(--line) transparent; }
  .adcol .ad { font-size: 13px; }
  .colhead { display: flex; justify-content: space-between; align-items: center; margin: -2px 0 10px; font-size: 12px; color: var(--muted); }
  .colhead b { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-r); }
  .spine { position: sticky; top: 88px; align-self: start; writing-mode: vertical-rl; padding: 16px 0; width: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted-r); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .spine:hover { color: var(--ink); border-color: var(--muted); }

  /* ---------- phone ---------- */
  .pbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--line); }
  .pbar .title { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
  .pbar .title b { display: block; color: var(--ink); font-size: 14px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar .title span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar .score .n { font-size: 19px; }
  .pbar .score .lb { display: none; }
  .pbar .link { font-size: 12.5px; white-space: nowrap; }
  .pmain { padding: 16px 16px 24px; }
  .lede { margin: 0 0 14px; color: var(--muted-r); font-size: 13px; }
  .lede b { color: var(--ink); font-weight: 600; }
  .pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .pcard.deal { animation: deal 340ms var(--out); }
  @keyframes deal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .pcard h3 { margin: 10px 0 0; font-size: 17px; font-weight: 620; line-height: 1.3; outline: none; }
  .dnote .jlink { display: block; font-size: 12.5px; padding: 4px 0 0 30px; }
  .pcard .jlink { font-size: 12.5px; padding: 2px 0 0; }
  .ptop { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12.5px; }
  .ptop .dots button { height: 6px; width: 26px; }
  .clip { margin: 12px -4px 0; background: #fff; color: var(--cv-ink); font: 14px/1.4 var(--cv-font); border-radius: 6px; padding: 10px 14px; box-shadow: 0 10px 24px -14px rgba(0,0,0,.6); }
  .clip .ctx { color: var(--cv-grey); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .clip del { display: block; color: var(--cv-grey); text-decoration-color: rgba(90,102,117,.7); margin: 6px 0 4px; }
  .clip .where { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--cv-blue); font-weight: 700; margin-bottom: 4px; }
  .pfold { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .pfold .ad { padding: 0 16px 16px; }
  .dock { position: sticky; bottom: 0; z-index: 20; display: grid; gap: 8px; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: var(--floor); border-top: 1px solid var(--line); }
  .dock .b { width: 100%; min-height: 48px; }
  .dock .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dock .row .b { min-height: 44px; }
  .dock .skip { justify-self: center; }

  /* ---------- sheets ---------- */
  .scrim { position: absolute; inset: 0; z-index: 60; background: rgba(5, 7, 10, .55); }
  .sheet { position: absolute; z-index: 61; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; animation: rise 340ms var(--out); }
  .sheet.side { top: 0; right: 0; bottom: 0; width: min(440px, 100%); border-radius: 16px 0 0 16px; }
  .sheet.up { left: 0; right: 0; bottom: 0; max-height: 92%; border-radius: 18px 18px 0 0; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .sheet header b { font-size: 15px; font-weight: 620; }
  .sheet .body { overflow: auto; padding: 14px 18px 24px; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }

  .toast { position: absolute; z-index: 120; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; max-width: min(460px, calc(100% - 32px)); background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 13px; box-shadow: 0 16px 34px -12px rgba(0,0,0,.55); animation: rise 340ms var(--out); }
  .toast.phone { bottom: 200px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="banner"><b style="color:var(--gold)">PROTOTYPE · after #412</b> — where to read the job in full. Your Hong Kong digital transformation PM job and your CV, on the real white CV page. Nothing is saved.</div>
<div class="chrome" role="group" aria-label="Prototype view">
  <button id="v-auto">Computer</button><button id="v-phone">Phone</button><button id="v-reset">Reset</button>
</div>
<div id="app"></div>
<div class="pillbar" aria-label="Prototype variant switch, not part of the design">
  <div class="pill"><button id="pv-prev" aria-label="Previous variant">←</button><span id="pv-label"></span><button id="pv-next" aria-label="Next variant">→</button></div>
  <div class="pstate" id="pstate"></div>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
// ================= data =================
const JOB = { title: "Digital Transformation Project Manager", company: "a Hong Kong bank" };
const W = { essential: 3, standard: 2, nice: 1 };
const REQS = [
  { id: "years", band: "essential", text: "8+ years' experience in project management, consulting, or business transformation", fit: 1, note: "9.8 years: your Okoone job counts too, its lines show you ran delivery" },
  { id: "degree", band: "essential", text: "Bachelor's degree", fit: 1, note: "your Master's covers it" },
  { id: "lead-dt", band: "essential", text: "Lead the delivery of digital transformation projects", fit: 0.9 },
  { id: "large", band: "essential", text: "Experience with large-scale transformation", fit: 0.9 },
  { id: "xfunc", band: "essential", text: "Coordinate business, IT, operations, risk, compliance and finance", fit: 0.75 },
  { id: "bcase", band: "standard", text: "Business cases and project governance", fit: 0.75 },
  { id: "vendor", band: "standard", text: "Vendor management, including tenders and statements of work", fit: 0.6 },
  { id: "risk", band: "standard", text: "Manage risks and dependencies", fit: 0.9 },
  { id: "pmo", band: "standard", text: "PMO reporting to senior management", fit: 0.85 },

  }
  const jobLede = variant === "A" || variant === "E" || D ? ` · <button class="link" onclick="openJob()">Read the job</button>` : "";
  return `<header class="pbar"><div class="title"><b>${JOB.title}</b><span>${JOB.company}</span></div>${scoreHtml(false)}${variant === "B" ? `<button class="link" onclick="openJob()">The job</button>` : ""}<button class="link" onclick="openSheet('fit')">Where you fit</button></header>
    <main class="pmain">
      <p class="lede"><b>Your CV is ready.</b> It says only what is true about you. ${left ? `${left} suggestion${left > 1 ? "s" : ""} to stretch it for this job, all optional.` : ""} <button class="link" onclick="openSheet('cv')">See your CV</button>${jobLede}</p>
      ${card}
      ${variant === "C" ? foldHtml("pfold") : ""}
    </main>
    <footer class="dock">${dock}</footer>`;
}

function sheetHtml() {
  if (!S.sheet) return "";
  const phone = mode() === "phone";
  let label, head, body;
  if (S.sheet === "cv") {
    label = S.job ? "The job" : "Your CV for this job";
    head = variant === "A" || variant === "E" ? tabsHtml() : `<b>${label}</b>`;
    body = S.job ? adHtml({ marks: variant === "E" }) : paperHtml({ preview: false });
  } else if (S.sheet === "job") {
    label = "The job"; head = `<b>The job</b>`; body = adHtml({ marks: variant === "D" });
  } else {
    label = `Where you fit · ${metCount()} of ${REQS.length} met`; head = `<b>${label}</b>`;
    body = `${fitList()}<h4 class="h">Be ready to explain</h4>${explainHtml()}`;
  }
  return `<div class="scrim" onclick="closeSheet()"></div>
    <section class="sheet ${phone ? "up" : "side"}" role="dialog" aria-modal="true" aria-label="${esc(label)}">
      ${phone ? `<div class="grab"></div>` : ""}
      <header>${head}<button class="link" onclick="closeSheet()">Close</button></header>
      <div class="body" id="sheetBody">${body}</div></section>`;
}

// ================= render + post-render =================
function render({ focus = false, top = false } = {}) {
  const m = mode(), keep = top ? 0 : document.getElementById("scroll")?.scrollTop ?? 0;
  document.body.classList.toggle("framed", view === "phone");
  app.innerHTML = `<div class="scroll" id="scroll">${m === "desk" ? renderDesk() : renderPhone()}</div>` + sheetHtml();
  document.getElementById("scroll").scrollTop = keep;
  if (m === "desk") pinNote();
  markScroll(); S.jump = false;
  if (focus) { const f = document.getElementById("focusme"); if (f) f.focus({ preventScroll: true }); }
  S.landed = null; S.deal = false;
  document.getElementById("v-auto").setAttribute("aria-pressed", view === "auto");
  document.getElementById("v-phone").setAttribute("aria-pressed", view === "phone");
  readout();
}
function pinNote() {
  const note = document.getElementById("dnote"), rail = document.getElementById("rail");
  if (!note) return;
  const line = app.querySelector(`[data-line="${S.open}"]`);
  const top = line ? Math.max(0, line.getBoundingClientRect().top - rail.getBoundingClientRect().top - 18) : 0;
  note.style.top = top + "px";
  rail.style.minHeight = top + note.offsetHeight + "px";
}
function reveal() {
  const line = app.querySelector(`[data-line="${S.open}"]`);
  if (!line) return;
  const sc = document.getElementById("scroll"), r = line.getBoundingClientRect(), a = sc.getBoundingClientRect();
  if (r.top < a.top + 90 || r.bottom > a.bottom - 40) sc.scrollBy({ top: r.top - a.top - a.height / 3, behavior: REDUCED ? "auto" : "smooth" });
}
// D: bring the lit requirement into view inside its own column or sheet.
function markScroll() {
  const li = app.querySelector(".ad li.hl"), box = li?.closest(".adcol, .body");
  if (!box || (variant === "E" && !S.jump)) return;
  box.scrollTop += li.getBoundingClientRect().top - box.getBoundingClientRect().top - box.clientHeight / 3;
}
function readout() {
  const n = S.open ? idx(S.open) + 1 : 0;
  const mark = (variant === "D" || variant === "E") && S.job && S.open ? `marked: ${reqOf(sug(S.open)).id} (#${n})` : "nothing marked";
  document.getElementById("pv-label").textContent = VARIANTS[variant];
  document.getElementById("pstate").textContent = `${mode() === "desk" ? "computer" : "phone"} · job ${S.job ? "open" : "closed"} · ${mark}`;
}

// ================= the score =================
let scoreToken = 0;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function paintScore(roll) {
  const n = document.getElementById("scoreN");
  if (!n) return;
  n.textContent = shown;
  if (roll && !REDUCED) n.animate([{ transform: "translateY(38%)", opacity: 0.25 }, { transform: "none", opacity: 1 }], { duration: 110, easing: "cubic-bezier(.16,1,.3,1)" });
}
function flyMote(from) {
  const to = document.getElementById("scoreN")?.getBoundingClientRect();
  if (!from || !to) return Promise.resolve();
  const m = document.createElement("div");
  m.className = "mote"; document.body.appendChild(m);
  const x0 = from.left + Math.min(from.width, 40), y0 = from.top + from.height / 2, x1 = to.left + to.width / 2, y1 = to.top + to.height / 2;
  const mx = (x0 + x1) / 2, my = Math.min(y0, y1) - 80;
  const anim = m.animate([
    { transform: `translate(${x0}px, ${y0}px) scale(1)`, opacity: 0.2 },
    { transform: `translate(${mx}px, ${my}px) scale(1.3)`, opacity: 1, offset: 0.45 },
    { transform: `translate(${x1}px, ${y1}px) scale(.6)`, opacity: 1 },
  ], { duration: 720, easing: "cubic-bezier(.45,0,.2,1)" });
  return anim.finished.then(() => m.remove(), () => m.remove());
}
async function moveScore(beat, fromRect) {
  const token = ++scoreToken, target = pct();
  document.getElementById("live").textContent = `Match now ${target}%`;
  if (REDUCED) { shown = target; paintScore(false); return; }
  if (beat) {
    await flyMote(fromRect);
    if (token !== scoreToken) return;
    const sc = document.getElementById("score");
    sc?.classList.add("lit");
    sc?.querySelector(".n").animate([{ transform: "scale(1)" }, { transform: "scale(1.06)" }, { transform: "scale(1)" }], { duration: 460, easing: "cubic-bezier(.2,1.5,.4,1)" });
  }
  while (shown !== target) {
    if (token !== scoreToken) return;
    shown += Math.sign(target - shown);
    paintScore(beat);
    await wait(beat ? 75 : 45);
  }
  await wait(220);
  if (token === scoreToken) document.getElementById("score")?.classList.remove("lit");
}

// ================= actions =================
function saveEdit(id) {
  const el = app.querySelector(`[data-in="${id}"]`);
  if (!el) return;
  const t = el.textContent.trim();
  if (t && t !== sug(id).in) S.edits[id] = t;
}
function nextOpen(fromId) {
  const i = idx(fromId);
  return [...SUGG.slice(i + 1), ...SUGG.slice(0, i)].find((s) => !S.ans[s.id])?.id ?? null;
}
function answer(id, a) {
  if (S.editing === id) { saveEdit(id); S.editing = null; }
  const fromRect = app.querySelector(`[data-in="${id}"]`)?.getBoundingClientRect();
  S.ans[id] = a;
  if (a !== "no") S.landed = id;
  S.open = nextOpen(id); S.deal = true;
  render({ focus: true, top: mode() === "phone" });
  if (mode() === "desk") reveal();
  if (a !== "no") moveScore(true, fromRect);
  if (a === "true") toast(`Kept on your CV for every job, under ${sug(id).where}.`, id);
}
function undo(id) { delete S.ans[id]; S.open = id; S.deal = true; render({ focus: true }); moveScore(false); }
function edit(id) {
  if (S.editing === id) { saveEdit(id); S.editing = null; } else S.editing = id;
  render();
  if (S.editing) app.querySelector(`[data-in="${id}"]`)?.focus();
}
function go(id) { S.open = id; S.editing = null; S.deal = true; closeSheet(false); render({ focus: true }); if (mode() === "desk") reveal(); }
function step(d) {
  const i = S.open ? idx(S.open) : -1;
  if (d > 0 && S.open && S.ans[S.open]) { S.open = nextOpen(S.open); S.deal = true; render({ focus: true }); if (mode() === "desk") reveal(); return; }
  go(SUGG[(i + d + SUGG.length) % SUGG.length].id);
}
function skipRest() { S.open = null; S.deal = true; render({ focus: true }); }
function approve() { toast(pending().length ? "Approved. The suggestions you did not answer are left out." : "Approved. (Prototype: nothing is sent.)"); }
function openSheet(k) { S.sheet = k; if (k === "cv") S.job = false; render(); document.querySelector(".sheet .link")?.focus(); }
function closeSheet(rerender = true) { if (!S.sheet) return; if (S.sheet !== "fit") S.job = false; S.sheet = null; if (rerender) render(); }
function setTab(v) { S.job = v; render({ top: variant === "E" }); }
// Where "open the job" goes depends on the variant and the screen.
// E: jump = "See where the job asks this" (opens the job tab at the lit line); otherwise the top.
function openJob(jump = false) {
  const phone = mode() === "phone";
  S.job = true; S.jump = jump;
  if (variant === "B" || (variant === "D" && phone)) S.sheet = "job";
  if ((variant === "A" || variant === "E") && phone) S.sheet = "cv";
  render({ top: variant === "E" && !phone });
  if (variant === "E" && jump && !phone) reveal();
  if (variant === "C") {
    const f = app.querySelector(".rfold, .pfold"), sc = document.getElementById("scroll");
    if (f) sc.scrollTop += f.getBoundingClientRect().top - sc.getBoundingClientRect().top - (phone ? 70 : 120);
    if (!phone) pinNote();
  }
}
function closeJob() { if (S.sheet && S.sheet !== "fit") return closeSheet(); S.job = false; render(); }
function foldToggled(el) { S.job = el.open; if (mode() === "desk") pinNote(); readout(); }
function toast(msg, undoId) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast" + (mode() === "phone" ? " phone" : "");
  t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(msg)}</span>${undoId ? `<button class="link">Undo</button>` : ""}`;
  if (undoId) t.querySelector("button").onclick = () => { t.remove(); undo(undoId); };
  app.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}
function setVariant(d) {
  const keys = Object.keys(VARIANTS);
  variant = keys[(keys.indexOf(variant) + d + keys.length) % keys.length];
  const u = new URL(location.href); u.searchParams.set("variant", variant); history.replaceState(null, "", u);
  S.job = false; S.sheet = null; S.editing = null;
  render();
}

// ================= wiring =================
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.editing) { edit(S.editing); return; } closeSheet(); return; }
  if (e.target.closest("[contenteditable='true'], input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); setVariant(e.key === "ArrowLeft" ? -1 : 1); return; }
  if (S.sheet) return;
  const k = e.key.toLowerCase(), open = S.open && !S.ans[S.open] ? S.open : null;
  if (k === "j") step(1); else if (k === "k") step(-1);
  else if (open && k === "u") answer(open, "use");
  else if (open && k === "t") answer(open, "true");
  else if (open && k === "n") answer(open, "no");
  else if (open && k === "e") { e.preventDefault(); edit(open); }
});
document.getElementById("pv-prev").onclick = () => setVariant(-1);
document.getElementById("pv-next").onclick = () => setVariant(1);
let lastMode = null;
new ResizeObserver(() => { const m = mode(); if (m !== lastMode) { lastMode = m; render(); } else if (m === "desk") pinNote(); }).observe(app);
const setView = (v) => { view = v; const u = new URL(location.href); v === "phone" ? u.searchParams.set("view", "phone") : u.searchParams.delete("view"); history.replaceState(null, "", u); lastMode = null; render(); };
document.getElementById("v-auto").onclick = () => setView("auto");
document.getElementById("v-phone").onclick = () => setView("phone");
document.getElementById("v-reset").onclick = () => { S = fresh(); shown = pct(); scoreToken++; render(); };
render();
lastMode = mode();
</script>
</body>
</html>
