# Fly app config for the web shell. Proxies /api/* to the API app (see next.config.mjs).
app = "jobcrush-web-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.web"

  [build.args]
    API_URL = "https://jobcrush-api-staging.fly.dev"

[env]
  APP_ENV = "staging"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[checks.health]
  type = "http"
  port = 3000
  path = "/"
  interval = "30s"
  timeout = "5s"
