name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are held at their current major. v4 of all three targeted the retired Node 20
      # runtime: GitHub was force-running them on Node 24 and warning on every build, and that
      # compatibility shim is temporary — when it goes, CI fails and (since a green build is what
      # deploys) we cannot ship until it is fixed. v5+ targets Node 24 natively.
      - uses: actions/checkout@v7
      # No `version:` input on purpose — it reads `packageManager` from package.json
      # (pnpm@11.13.1), so the pinned pnpm version lives in one place, not two.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Tier 1 e2e: the 8 route-mocked Playwright specs (everything except onboarding.spec.ts, the one
  # spec that drives the real paid model — that one never runs in CI) against the checked-in
  # fake-model API (apps/api/src/qa-main.ts). Runs in parallel with `test`, not after it, to keep
  # wall-clock down — deploy-staging waits on both below.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobcrush/contracts --filter @jobcrush/ui --filter @jobcrush/api build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # :34101, not :3001 (main.ts's port) — qa-main.ts's own default. Both processes expose
      # GET /healthz identically, so a health-wait against /healthz could pass against a real dev
      # API already up on 3001 and the "never spend money" run would spend. /qa/llm-calls exists
      # only on qa-main.ts (main.ts 404s it), so a response here proves it's the fake that answered.
      - name: start the fake-model API
        run: |
          pnpm --filter @jobcrush/api start:qa > /tmp/qa-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:34101/qa/llm-calls > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:34101/qa/llm-calls || { echo "qa-main.js did not become healthy"; cat /tmp/qa-api.log; exit 1; }
      # API_URL is baked into the web build at BUILD time (next.config.mjs), not read at start — so
      # the fake-model API must already be listening, on the exact URL passed below, before this
      # runs. Built directly with pnpm --filter, never `pnpm build` (turbo): turbo does not hash
      # API_URL as a build input, so a cached task could silently serve a stale API target.
      - run: API_URL=http://127.0.0.1:34101 pnpm --filter @jobcrush/web build
      - name: start the web app
        run: |
          pnpm --filter @jobcrush/web start > /tmp/qa-web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/ || { echo "next start did not become healthy"; cat /tmp/qa-web.log; exit 1; }
      - run: E2E_BASE_URL=http://127.0.0.1:3000 pnpm --filter @jobcrush/web e2e:mocked
      # All 8 Tier 1 specs route-mock every PAID pipeline call — this run must never actually reach
      # the fake model on mine/tailor/grill/audit. A non-zero count here means a spec started hitting
      # the real fake unmocked, which is a gate-scope change that deserves its own look, not a silent
      # pass. `judge` is deliberately NOT in this check: measured 2026-08-13 (#209), a Tier 1 run
      # leaves it at ~8, because a spec reaches the deck route unmocked and that route now calls the
      # (free, instant) fake judge. See qa-main.ts's header before tightening this.
      - name: assert Tier 1 never touched the fake model
        run: |
          calls=$(curl -sf http://127.0.0.1:34101/qa/llm-calls)
          echo "qa-main.js call counts: $calls"
          echo "$calls" | grep -q '"mine":0,"tailor":0,"grill":0,"audit":0' || { echo "Tier 1 called the fake model — it should stay route-mocked end to end"; exit 1; }
      # Tier 2 (#199): the real-stack journeys listed in run-tier2.mjs — that array is the fact, so
      # this comment deliberately does not restate the count. They run against the SAME
      # fake-model API + web processes Tier 1
      # just proved healthy — no rebuild, no restart. Real Fastify, real stores, real extraction, real
      # render; only the model is faked. Sequential (qa-driver.mjs's own reasoning: several journeys
      # mint a real magic-link sign-in against auth's 5-per-15-min-per-IP limiter, routes/auth.ts — a
      # single job run only ever spends 4 of that budget, comfortably under the cap; no session-cap or
      # rate-limit override was needed beyond qa-main.ts's own generous IpRateLimiter, already landed
      # by #198). factbadge-floor-journey.mjs is deliberately excluded — see run-tier2.mjs's header for
      # the measured reason. Continues through a failure so every journey still gets its HTML report,
      # then fails the step (and so the job, and so the deploy) if any journey failed.
      - run: BASE_URL=http://127.0.0.1:3000 pnpm --filter @jobcrush/web e2e:tier2
      # v7, not v4 — this file's own header records why: v4 targets the retired Node 20 runtime and
      # survives only on a temporary compatibility shim, so a v4 action here would eventually fail
      # the job that GATES THE DEPLOY. Held at the current major like every other action above.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/qa-results/
            /tmp/qa-api.log
            /tmp/qa-web.log
          if-no-files-found: ignore
          retention-days: 7

  # Deploys to Fly staging on every green main build (JC-6 unblocked 2026-07-17).
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, e2e]
    # Serialize deploys: two pushes minutes apart (normal with parallel agent sessions) would
    # otherwise race and could land the OLDER build last — a live site quietly running stale code.
    # No cancel-in-progress: an in-flight deploy finishes, the next one waits its turn.
    concurrency: deploy-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a release tag, NOT @master. On @master every deploy silently picked up whatever
      # had last been pushed upstream — an unannounced change to the tool that ships our releases,
      # where the first symptom would be a failed deploy. Tag 1.6 is the same commit
      # (ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1) @master resolved to, so this pins today's proven
      # behaviour rather than changing it.
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: flyctl deploy --config fly.api.toml --build-arg BUILD_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Web uses its own app-scoped deploy token (Fly deploy tokens are per-app).
      - run: flyctl deploy --config fly.web.toml --build-arg BUILD_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
