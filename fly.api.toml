# JC-6 — Fly app config for the API. Region per JC-4's data-residency note.
app = "jobcrush-api-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # #363: a CV review runs outside any request and would be cut by this stop; while one is going,
  # the process holds a request open to its own public URL (cvReviewRun.ts keepAliveOverHttp).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# #312: the machine size is a declared, reviewable fact, not a property of one long-lived machine.
# Matches the live machine (scaled 256MB → 2GB 2026-09-27, owner-approved #297): a machine
# recreated at Fly's 256MB default cannot host the headless browser, and the failure mode is not a
# failed PDF — Fly's OOM kill takes the whole API down. SHARED_INFRA.md rule 7 carries the record.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"

[checks.health]
  type = "http"
  port = 3000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
