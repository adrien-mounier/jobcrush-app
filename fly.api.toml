# JC-6 — Fly app config for the API. Region per JC-4's data-residency note.
app = "jobcrush-api-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[checks.health]
  type = "http"
  port = 3000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
